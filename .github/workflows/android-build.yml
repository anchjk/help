
name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_API: '36'
  BUILD_TOOLS: '36.0.0'
  GRADLE_VERSION: '9.6.0'

jobs:
  build:
    name: Build EVNQT1 HELP DESK APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run core tests
        run: bash ./test-core.sh

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \; 2>/dev/null || true
          {
            echo "Commit: $GITHUB_SHA"
            echo "Java: $JAVA_VERSION"
            echo "Gradle: $GRADLE_VERSION"
            echo "Android API: $ANDROID_API"
            echo "Build tools: $BUILD_TOOLS"
            echo
            echo "APK files:"
            find artifacts -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n' || true
          } > artifacts/BUILD_INFO.txt
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVNQT1-HELP-DESK-APKs
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14
